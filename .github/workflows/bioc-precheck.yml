name: Bioconductor Submission Precheck

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: write   # REQUIRED for pushing to submissions branch

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # Checkout default branch (contains workflow + scripts)
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIOC_ORG_TOKEN: ${{ secrets.BIOC_ORG_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUBMISSIONS_PATH: submissions/submitted_packages.csv
        run: python scripts/validate.py