name: Bioconductor Policy Acceptance & Clone

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        default: '1'

permissions:
  issues: write
  contents: write

jobs:
  accept_policies:
    runs-on: ubuntu-latest
    # Run if triggered by comment OR manually
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.comment.body == 'accept-policies' ||
      github.event.comment.body == '/accept-policies'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Handle acceptance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTO_ACCEPT: true
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: python scripts/accept_policies.py

  clone_and_register:
    runs-on: ubuntu-latest
    needs: accept_policies
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "Bioconductor Bot"
          git config --global user.email "bot@bioconductor.org"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Clone Default Branch & Register
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIOC_STAGING_TOKEN: ${{ secrets.BIOC_STAGING_TOKEN }}
          BIOC_STAGING_ORG: "BiocStaging"
          SPB_RUNIVERSE: "biocstaging"
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: python scripts/clone_and_register.py
